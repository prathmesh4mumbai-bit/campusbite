# Runs the CampusBite backend (FastAPI) and its PostgreSQL database.
# All configuration comes from a local `.env` file (copy `.env.example` -> `.env`).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-campusbite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # localhost only, handy for psql / DB clients
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-campusbite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campusbite}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REMINDER_THRESHOLD_MINUTES: ${REMINDER_THRESHOLD_MINUTES:-15}
      REMINDER_INTERVAL_SECONDS: ${REMINDER_INTERVAL_SECONDS:-60}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@1234}
    ports:
      - "8000:8000"

volumes:
  pgdata:
